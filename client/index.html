<!doctype html>
<html lang="hr">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary SEO Meta Tags -->
    <title>Stvarna Slika — Istraživanje psihe, svijesti i integrativne znanosti</title>
    <meta name="title" content="Stvarna Slika — Istraživanje psihe, svijesti i integrativne znanosti" />
    <meta name="description" content="Stvarna Slika je istraživačka platforma za integrativna istraživanja psihe: klinička psihologija, parapsihologija i teorije svijesti. Članci, analize i konzultacije za ozbiljno istraživanje." />
    <meta name="keywords" content="psihologija, parapsihologija, svijest, Jung, forenzička psihologija, ESP, kvantna svijest, istraživanje" />
    <meta name="author" content="Luka Anić-Antić, Stvarna Slika" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://stvarnaslika.life/" />
    <meta name="theme-color" content="#F8FAFC" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stvarnaslika.life/" />
    <meta property="og:title" content="Stvarna Slika — Istraživanje psihe i svijesti" />
    <meta property="og:description" content="Platforma za integrativna istraživanja psihe: klinička psihologija, parapsihologija i teorije svijesti. Članci, analize i konzultacije." />
    <meta property="og:image" content="https://d2xsxph8kpxj0f.cloudfront.net/310519663360791554/9Xytk5XuyaGQiwf2ptjWSz/hero-bg_b62bb861.jpg" />
    <meta property="og:locale" content="hr_HR" />
    <meta property="og:site_name" content="Stvarna Slika" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://stvarnaslika.life/" />
    <meta property="twitter:title" content="Stvarna Slika — Istraživanje psihe i svijesti" />
    <meta property="twitter:description" content="Platforma za integrativna istraživanja psihe: članci, analize i konzultacije iz područja psihologije i teorija svijesti." />
    <meta property="twitter:image" content="https://d2xsxph8kpxj0f.cloudfront.net/310519663360791554/9Xytk5XuyaGQiwf2ptjWSz/hero-bg_b62bb861.jpg" />

    <!-- Canonical / Sitemap -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured Data - Organization & WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Stvarna Slika",
          "url": "https://stvarnaslika.life",
          "logo": "https://stvarnaslika.life/assets/logo.png",
          "sameAs": ["https://stvarnaslika.com"],
          "contactPoint": [{ "@type": "ContactPoint", "email": "info@stvarnaslika.com", "contactType": "customer service", "availableLanguage": ["hr","en"] }]
        },
        {
          "@type": "WebSite",
          "name": "Stvarna Slika",
          "url": "https://stvarnaslika.life",
          "inLanguage": "hr",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://stvarnaslika.life/blog?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
