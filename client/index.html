  <head>

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Stvarna Slika",
      "url": "https://stvarnaslika.life",
      "description": "Platforma za istraživanje psihologije, parapsihologije i alternativnih pristupa razumijevanju psihe.",
      "founder": { "@type": "Person", "name": "Luka Anić-Antić" },
      "contactPoint": { "@type": "ContactPoint", "email": "info@stvarnaslika.com", "contactType": "customer service", "availableLanguage": "Croatian" },
      "sameAs": ["https://stvarnaslika.com"]
    }
    </script>

    <!-- Structured Data - WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Stvarna Slika",
      "url": "https://stvarnaslika.life",
      "description": "Psihologija, parapsihologija i alternativni pristupi razumijevanju psihe",
      "inLanguage": "hr",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://stvarnaslika.life/blog?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer

      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
